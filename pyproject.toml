[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eces-housing-pipeline"
version = "0.1.0"
description = "Data engineering and bilingual text extraction pipeline for the ECES Egyptian housing market task"
requires-python = ">=3.10"

dependencies = [
    "httpx>=0.27,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "lxml>=5.0,<7.0",
    "pydantic>=2.7,<3.0",
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1,<4.0",
    "playwright>=1.50,<2.0",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.28,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]